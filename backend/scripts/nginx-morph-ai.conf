# ================================================================
# Nginx Configuration for MorphAI API Server
# Domain: api.morph-ai.asia
# Location on VPS: /etc/nginx/sites-available/morph-ai.conf
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.morph-ai.asia;

    # Автоматический редирект HTTP на HTTPS (активируется после certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Заголовки проксирования
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для длительных AI-генераций
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        proxy_cache_bypass $http_upgrade;
    }
}
